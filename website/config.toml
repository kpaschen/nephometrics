baseURL = "http://www.nephometrics.ch/"
title = "www.paschen.ch"
theme = "basic-site"
relativeUrls = true
pygmentsCodeFences = true
pygmentsUseClasses = true
summaryLength = 20

[permalinks]
  blog = "/:year/:month/:title/"

[markup]
  defaultMarkdownHandler = 'goldmark'
  [markup.goldmark.renderer]
    unsafe = true

DefaultContentLanguage = "en"
[languages]
  [languages.en]
    languageName = "EN"
  [languages.de]
    languageName = "DE"
    [[languages.de.menu.main]]
      identifier = "home"
      url = "de/"
      name = "Startseite"
      weight = 100
    [[languages.de.menu.main]]
      identifier = "contact"
      name = "Kontakt"
      url = "de/contact/" 
      weight = 200
    [[languages.de.menu.main]]
      identifier = "blog"
      name = "Blog"
      url = "blog/" 
      weight = 110
  [languages.fr]
    languageName = "FR"
    [[languages.fr.menu.main]]
      identifier = "home"
      url = "fr/"
      name = "Page d'Accueil"
      weight = 100
    [[languages.fr.menu.main]]
      identifier = "contact"
      name = "Contact"
      url = "fr/contact/" 
      weight = 200
    [[languages.fr.menu.main]]
      identifier = "blog"
      name = "Blog"
      url = "blog/" 
      weight = 110


[menu]
  [[menu.main]]
    identifier = "home"
    name = "Home"
    url = ""
    weight = 100

  [[menu.main]]
    identifier = "contact"
    name = "Contact"
    url = "contact/"
    weight = 200

  [[menu.main]]
    identifier = "blog"
    name = "Blog"
    url = "blog/"
    weight = 110

